[package]
name = "eth-prices-bench"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
alloy = { version = "1", features = ["provider-http", "reqwest-rustls-tls"], default-features = false }
eth-prices = { path = "../pkg" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
